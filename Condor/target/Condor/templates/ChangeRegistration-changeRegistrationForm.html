<!-- This is a Pebble Template which inherits from ... -->
{% extends swiftVersion|slice(0,3) == "Con" ? "SKYLARK" : "JAY" %}
{% block results %}
<link rel="stylesheet" href="help-pages.css" type="text/css">
<script src="help-pages.js"></script>
<link rel="stylesheet" href="owl.css" type="text/css">
<div class="results owl-basket-page">
	{% include "oneverypage" %}
	<div class="help-header">
	  <h2>{{ title }}</h2>
	  <p>Update your registered contact details.</p>
	</div>
	<div class="owl-form-card">
	<form target="_self" method="post" action="changeRegistration"
		name="input" onsubmit="return validateChangeRegistrationForm(this)">
		<input class="owl-submit-button" type="submit" value="Submit">
		<table class="owl-table" style="margin-top:14px;">
			<tr>
				<td style="width:35%;"><label for="firstName">First Name:</label></td>
				<td><input type="text" id="firstName" name="firstName" size="45"
					maxlength="45" value="{{ firstName }}"> *</td>
			</tr>
			<tr>
				<td><label for="lastName">Last Name:</label></td>
				<td><input type="text" id="lastName" name="lastName" size="45" maxlength="45"
					value="{{ lastName }}"> *</td>
			</tr>
			<tr>
				<td><label for="academicAffiliation">Academic Affiliation:</label></td>
				<td><input type="text" id="academicAffiliation" name="academicAffiliation" size="45"
					maxlength="45" value="{{ affiliation }}"> *</td>
			</tr>
			<tr>
				<td><label for="address1">Address 1:</label></td>
				<td><input type="text" id="address1" name="address1" size="45" maxlength="45"
					value="{{ address1 }}"> *</td>
			</tr>
			<tr>
				<td><label for="address2">Address 2:</label></td>
				<td><input type="text" id="address2" name="address2" size="45" maxlength="45"
					value="{{ address2 }}"> *</td>
			</tr>
			<tr>
				<td><label for="city">City:</label></td>
				<td><input type="text" id="city" name="city" size="45" maxlength="45"
					value="{{ city }}"> *</td>
			</tr>
			<tr>
				<td><label for="county">County:</label></td>
				<td><input type="text" id="county" name="county" size="45" maxlength="45"
					value="{{ county }}"></td>
			</tr>
			<tr>
				<td><label for="postcode">Postcode:</label></td>
				<td><input type="text" id="postcode" name="postcode" size="10" maxlength="10"
					value="{{ postcode }}"> *</td>
			</tr>
			<tr>
				<td><label for="phone">Phone:</label></td>
				<td><input type="text" id="phone" name="phone" size="20" maxlength="20"
					value="{{ phone }}"> *</td>
			</tr>
			<tr>
				<td><label for="email">Email:</label></td>
				<td><input type="text" id="email" name="email" size="45" maxlength="45"
					value="{{ email }}"> *</td>
			</tr>
			<tr>
				<td></td>
				<td style="font-size:12px;color:#666;">* indicates a mandatory field</td>
			</tr>
		</table>
	</form>
	</div>
</div>
{% endblock results %}
