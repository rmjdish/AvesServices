<!-- This is a Pebble Template which inherits from ... -->
{% extends swiftVersion|slice(0,3) == "Con" ? "SKYLARK" : "JAY" %}
{% block results %}
{% include "oneverypage" %}
<div class="results">
	<h2>{{ title }}</h2>
	<form name="description"
		onsubmit="return validateSharedBasketForm(this)" action="sharedBasket" method="post">
		<br>Enter description for shared basket: 
		<input type="text" name="desc" size="60" maxlength="120"> * 
		<input type="submit" value="Submit"> 
		<input type="hidden" name="basketID" value="{{ basketId }}">
		<input type="hidden" name="command" value="existing">
		<input type="hidden" name="id" value={{ sessionID }}>
	</form>
	<p>(* indicates a mandatory field)</p>
{% endblock %}
