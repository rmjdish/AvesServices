<!-- This is a Pebble Template which inherits from ... -->
{% extends swiftVersion|slice(0,3) == "Con" ? "SKYLARK" : "JAY" %}
{% block results %}
<div class="results">
{% include "oneverypage" %}
<h2>{{ title }}</h2>
<form name="input"
      onsubmit="return validateSearchForm(this)" 
      action="search"
      method="post" 
      target="_self">
         	
   <p><input class="testbutton" type="submit" value="Search"></p>
   	  
   <table>
      <tr>
      	<td style="width:10%;">Keyword:</td>
      	<td><input type="text" name="term" size="40" maxlength="60">*
            <input type=checkbox name="soundex">Soundex?
            <input type="hidden" name="type" value="kc">
      	</td>
      </tr>
      <tr>
        <td style="width:10%;">Category:</td>
        <td><select name="category">
  			<option value="" selected>ALL</option>
  			{% for cat in categories %}
    			<option value="{{ cat.key }}">{{ cat.value }}</option>
  			{% endfor %}
			</select>
        </td>
      </tr>
   </table>   
</form>
</div>
{% endblock results %}
