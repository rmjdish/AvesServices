<!-- This is a Pebble Template which inherits from ... -->
{% extends swiftVersion|slice(0,3) == "Con" ? "SKYLARK" : "JAY" %}
{% block results %}
{% include "oneverypage" %}
<div class="results">
<h2>NSHD Search by Topic</h2>

<form name="input"
      onsubmit="return validateSearchForm(this)"
      action="search"
      method="post"
      target="_self"
      >
  <br>Topic:
<select name="topic">
  <option value="" selected>ALL</option>
  {% for tpc in topics %}
    <option value="{{ tpc  }}">{{ tpc }}</option>
  {% endfor %}
</select>
<input type="hidden" name="type" value="t">
&nbsp;&nbsp;&nbsp;
<input class="testbutton" type="submit" value="Search">
</form>
</div>
{% endblock results%}
