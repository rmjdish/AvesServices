[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "transform"
version = "2026.0.1"
requires-python = ">= 3.9"
dependencies = []
authors = [
   {name = "Philip Curran", email = "philipcurran@duck.com"},
   {email = "philipcurran@duck.com"}
   ]
maintainers = [
   {name = "Philip Curran", email = "philipcurran@duck.com"}
   ]
description = "Package for supporting long/wide transformations of CSV files"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords=['python', 'transform']
classifiers= [
  "Development Status   :: 4 - Beta",
  "Intended Audience    :: Data Managers",
  "Topic :: Data Management :: Tools",
  "Programming Language :: Python :: 3",
  "Operating System     :: MacOS :: MacOS X",
  "Operating System     :: Microsoft :: Windows",
  "Operating System     :: Linux :: Debian",
]

# Add this section for console scripts
[project.scripts]
transform-csv = "transform.cli:main"

# Optional: Add if you want to expose as a module entry point
[project.entry-points."console_scripts"]
transform = "transform.cli:main"  # Alternative syntax

