<!-- This is a Pebble Template which inherits from ... -->
{% extends "Login-adminUserPage" %}

{% block results %}
<div class="results">
<h2>{{ title }}</h2>
{% include "oneverypage" %}
{% if results is not empty %}
<form name="input"
      method="post"
      action="resetPassword"
      onsubmit="return validatePasswordForm(this)"
      >
  <table class="results">
    <tr><td style="font-size: 125%">Select User</td><td>
    <select name="username">
    {% for cand in results %}
    <option value="{{ cand }}">{{ cand }}</option>
    {% endfor %}
    </select></td>
    </tr>
    <tr>
      <td style="font-size: 125%">New Password:</td>
      <td style="font-size: 125%"><input name="password1" type="password" size="20" maxlength="20"></td>
    </tr>
    <tr>
      <td style="font-size: 125%">Verify Password:</td>
      <td style="font-size: 125%"><input type="password" name="password2" size="20" maxlength="20"> * </td>
    </tr>
    <tr>
      <td></td>
      <td>* Note: All passwords are case-sensitive.</td>
    </tr>
    <tr>
      <td></td>
      <td><input class="testbutton"
		 type="submit"
		 value="Submit"
		 formaction="resetPassword"
		 formmethod="post"
		 >
      </td>
    </tr>
  </table>
</form>
{% endif %}
{% endblock %}
