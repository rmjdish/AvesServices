<!-- This is a Pebble Template which inherits from ... -->
{% extends swiftVersion|slice(0,6) == "Condor" ? "SKYLARK" : "SWIFT" %}
{% block results %}
{% include "oneverypage" %}
<div class="results">
	<h2>{{ title }}</h2>
	<form name="input" onsubmit="return validateSearchForm(this)"
		action="search" method="post" target="_self">

		<p>
			<input class="testbutton" type="submit" value="Search">
		</p>

		<table>
			<tr>
				<td style="width: 10%;">Category:</td>
				<td><select name="category"> 
				{# The tricky bit is that categories come in tuple pairs: (code,label) as a Map #} 
				{% for cat in categories %}
					<option value="{{ cat.key  }}">{{ cat.value }}</option> 
				{% endfor %}
				</select> <input type="hidden" name="type" value="yc"></td>
			</tr>
			<tr>
				<td style="width: 10%;">Year:</td>
				<td><select name="year">
						<option value="" selected>ALL</option> 
						{% for year in studyYears %}
							<option value="{{ year }}">{{ year }}</option> 
						{% endfor %}
				</select></td>
			</tr>
		</table>
	</form>
</div>
{% endblock results %}
