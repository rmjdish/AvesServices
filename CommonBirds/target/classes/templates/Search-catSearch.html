<!-- This is a Pebble Template which inherits from ... -->
{% extends swiftVersion|slice(0,3) == "Con" ? "SKYLARK" : "JAY" %}
{% block results %}
{% include "oneverypage" %}
<link rel="stylesheet" href="help-pages.css" type="text/css">
<script src="help-pages.js"></script>
<link rel="stylesheet" href="owl.css" type="text/css">
<div class="results owl-basket-page">
<div class="help-header">
  <h2>NSHD Search by Category</h2>
  <p>Search within a single category, if you already know which one you need.</p>
</div>
<form name="input"
      onsubmit="return validateSearchForm(this)"
      action="search"
      method="post"
      target="_self"
      >
  <div class="owl-form-card">
    <label for="owlCategory">Category</label>
    <select id="owlCategory" name="category" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #d3c3f0;border-radius:5px;font-size:14px;font-family:Arial, sans-serif;margin:0 0 4px 0;background-color:#fff;">
      <option value="" selected>ALL</option>
      {# The tricky bit is that categories come in tuple pairs: (code,label) as a Map #}
      {% for cat in categories %}
        <option value="{{ cat.key  }}">{{ cat.value }}</option>
      {% endfor %}
    </select>
    <input type="hidden" name="type" value="c">
    <button class="owl-submit-button" type="submit" style="margin-top:10px;">Search</button>
  </div>
</form>
</div>
{% endblock %}
