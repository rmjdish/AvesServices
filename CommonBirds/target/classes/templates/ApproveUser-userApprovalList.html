<!-- This is a Pebble Template which inherits from ... -->
{% extends "Login-adminUserPage" %}
{% block results %}
<div class="results">
	{% include "oneverypage" %}
	<h2>{{ title }}</h2>
	<table>
		<tr>
			<th>User Name</th>
			<th></th>
			<th></th>
			<th></th>
		</tr>

		{% for val in results %}
		<tr>
			<td>{{ val }}</td>
			<td><a
				href="approveUser?id={{ sessionID }}&user={{ val }}&approve=external">Approve External</a></td>
			<td><a href="approveUser?id={{ sessionID }}&user={{ val }}&approve=review">Review</a></td>
			<td><a href="approveUser?id={{ sessionID }}&user={{ val }}&approve=no">Refuse</a></td>
		</tr>
		{% endfor %}

	</table>
</div>
{% endblock %}
