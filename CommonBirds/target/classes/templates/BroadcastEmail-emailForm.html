<!-- This is a Pebble Template which inherits from ... -->
{% extends "JAY" %}
{% block results %}
{% include "oneverypage" %}
<div class="results">
	<h2>{{ title }}</h2>
	<form name="input" onsubmit="return validateEmailForm(this)"
		action="BroadcastEmail" method="post" target="_self">

		<br>Subject: <input type="text" name="subject" size="40"
			maxlength="80"> <br>Message:
		<textarea name="body" cols="80" rows="10"></textarea>
		&nbsp;&nbsp;&nbsp; <br> <input class="testbutton" type="submit"
			value="Send">
	</form>
</div>
{% endblock %}
