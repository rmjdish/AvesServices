<!-- This is a Pebble Template which inherits from ... -->
{% extends swiftVersion|slice(0,3) == "Con" ? "SKYLARK" : "JAY" %}
{% block results %}
{% include "oneverypage" %}
<link rel="stylesheet" href="help-pages.css" type="text/css">
<script src="help-pages.js"></script>
<link rel="stylesheet" href="owl.css" type="text/css">
<div class="results owl-basket-page">
<div class="help-header">
  <h2>NSHD Search by Library File</h2>
  <p>Search within a specific data library, if you already know which one you need.</p>
</div>

<form name="input"
      onsubmit="return validateSearchForm(this)"
      action="search"
      method="post"
      target="_self"
      >
  <div class="owl-form-card owl-form-card-wide">
    <label for="owlLibrary">Library File</label>
    <select id="owlLibrary" name="library" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #e0b8c2;border-radius:5px;font-size:14px;font-family:Arial, sans-serif;margin:0 0 4px 0;background:linear-gradient(to bottom, #FFFFFF, #CFCFCF);color:#8a3a4d;">
      <option value="" selected>ALL</option>
      {% for lib in libNames %}
        <option value="{{ lib  }}">{{ lib }}</option>
      {% endfor %}
    </select>
    <input type="hidden" name="type" value="l">
    <button class="owl-submit-button" type="submit" style="margin-top:10px;">Search</button>
  </div>
</form>
</div>
{% endblock results%}
